[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nibe-mqtt"
authors = [
    {name = "Jevgeni Kiski", email = "yozik04@gmail.com"}
]
description = "Nibe heatpump MQTT integration"
readme = "README.md"
keywords = ["nibe", "modbus", "library", "nibegw", "mqtt"]
license = "LGPL-3.0-or-later"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = [
    "nibe>=2.26.0,<3.0.0",
    "paho_mqtt>=2.1.0",
    "voluptuous>=0.13.0",
    "pyyaml>=6.0",
    "python-slugify>=6.0.0",
]
dynamic = ["version"]

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
]
dev = [
    {include-group = "test"},
    "tox>=4.22",
    "black>=22.0.0",
    "isort>=5.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "nibe_mqtt.__version__"}

[project.urls]
Homepage = "https://github.com/yozik04/nibe-mqtt"
"Bug Tracker" = "https://github.com/yozik04/nibe-mqtt/issues"

[project.scripts]
nibe-mqtt = "nibe_mqtt.console_scripts.nibe_mqtt_service:main"

[tool.setuptools]
zip-safe = true

[tool.setuptools.packages.find]
include = ["nibe_mqtt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 160
target-version = ["py311", "py312", "py313", "py314", "py315"]

[tool.isort]
profile = "black"
src_paths = ["nibe_mqtt", "tests"]
multi_line_output = 0

[tool.tox]
env_list = ["py311", "py312", "py313", "py314", "py315"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
change_dir = "tests"
dependency_groups = ["test"]
commands = [["pytest", "--basetemp={env_tmp_dir}", {replace = "posargs", extend = true}]]

[tool.coverage.report]
show_missing = true
